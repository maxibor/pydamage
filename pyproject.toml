[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydamage"
version = "1.0"
description = "Damage parameter estimation for ancient DNA"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Maxime Borry", email = "borry@shh.mpg.de" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "click>=8.0.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "pysam>=0.19.0",
    "scipy>=1.7.0",
    "statsmodels>=0.13.0",
    "matplotlib>=3.4.0",
    "tqdm>=4.60.0",
    "biopython>=1.78",
    "kneed>=0.7.0",
    "numba>=0.55.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "py-spy>=0.3.0",
    "line-profiler>=4.0.0",
]
docs = [
    "sphinx-click",
    "recommonmark",
    "sphinx-rtd-theme",
    "nbsphinx",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "py-spy>=0.3.0",
    "line-profiler>=4.0.0",
]

[project.scripts]
pydamage = "pydamage.cli:cli"

[project.urls]
Homepage = "https://github.com/maxibor/pydamage"
Documentation = "https://pydamage.readthedocs.io"
Repository = "https://github.com/maxibor/pydamage.git"

[tool.hatch.build.targets.wheel]
packages = ["pydamage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning",
]
