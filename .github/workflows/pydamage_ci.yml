name: pydamage_ci

on: [push, pull_request]

jobs:
  pydamage_ci:
    name: pydamage_testing
    runs-on: 'ubuntu-latest'
    if: "!contains(github.event.head_commit.message, '[skip_ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --all-groups

      - name: Test with pytest
        run: |
          uv run pytest

      - name: Check pydamage help message
        run: |
          uv run pydamage --help

      - name: Check pydamage on test data
        run: |
          uv run pydamage analyze --verbose tests/data/aligned.bam
          uv run pydamage filter pydamage_results/pydamage_results.csv
          uv run pydamage analyze -f -g tests/data/aligned.bam
          uv run pydamage cite